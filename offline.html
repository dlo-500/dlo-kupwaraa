<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';">
<meta name="theme-color" content="#020408">
<title>Offline — District Litigation Office Kupwara</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;background:#020408;color:#e2e8f0;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
  }
  .icon{width:64px;height:64px;margin-bottom:20px;opacity:.9}
  h1{font-family:Georgia,serif;font-size:22px;margin-bottom:10px;color:#c5a059}
  p{font-size:14px;color:#94a3b8;max-width:340px;line-height:1.65;margin-bottom:24px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  button,a{
    background:#c5a059;color:#020408;border:none;border-radius:10px;padding:12px 22px;
    font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit;
  }
  a.ghost{background:transparent;color:#c5a059;border:1px solid rgba(197,160,89,.5)}
</style>
</head>
<body>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="1.5" aria-hidden="true">
    <path d="M1 9a16 16 0 0122 0M5 13a10 10 0 0114 0M9 17a4 4 0 016 0"/><line x1="2" y1="2" x2="22" y2="22"/>
  </svg>
  <h1>You're Offline</h1>
  <p>District Litigation Office Kupwara could not reach the network. Cached pages and data remain available. When you reconnect, the latest case information will load automatically.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">Try Again</button>
    <a class="ghost" href="index.html">Go Home</a>
  </div>
</body>
</html>
