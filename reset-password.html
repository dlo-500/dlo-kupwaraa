<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — District Litigation Office Kupwara</title>
  
  <!-- Strict Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    connect-src 'self' https://ibicsdsehxlsaygjnefk.supabase.co;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.1);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.35rem;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .banner {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
      line-height: 1.4;
    }

    .banner-error {
      background-color: var(--error-bg);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .banner-success {
      background-color: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .banner-info {
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid #3b82f6;
      color: #60a5fa;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 0.85rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="password"]:focus {
      border-color: var(--primary);
    }

    .requirements {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      line-height: 1.35;
    }

    button {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: var(--primary);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-link {
      margin-top: 1.5rem;
      text-align: center;
    }

    .footer-link a {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-link a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>District Litigation Office</h1>
    <p>Kupwara · Security Gateway</p>
  </div>

  <div id="statusBanner" class="banner banner-info" style="display: block;">
    Verifying security token...
  </div>

  <form id="passwordForm" style="display: none;" onsubmit="handlePasswordUpdate(event)">
    <div class="form-group">
      <label for="newPassword">New Secure Password</label>
      <input 
        type="password" 
        id="newPassword" 
        autocomplete="new-password" 
        required 
        placeholder="••••••••••••"
      />
      <div class="requirements">
        Min. 8 characters, with uppercase, lowercase, number, and special character.
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input 
        type="password" 
        id="confirmPassword" 
        autocomplete="new-password" 
        required 
        placeholder="••••••••••••"
      />
    </div>

    <button type="submit" id="submitBtn">Update Credentials</button>
  </form>

  <div class="footer-link">
    <a href="operator.html">← Return to Portal Login</a>
  </div>
</div>

<script>
  // Project client configuration with explicit PKCE flow
  const SUPABASE_URL = 'https://ibicsdsehxlsaygjnefk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliaWNzZHNlaHhsc2F5Z2puZWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTExNjczMjEsImV4cCI6MjA2Njc0MzMyMX0.4s8_JmB1e6n51oKqI7Wn14zUqV7jUfWqDk8eK9mX2bA';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      detectSessionInUrl: true,
      persistSession: true
    }
  });

  const banner = document.getElementById('statusBanner');
  const form = document.getElementById('passwordForm');
  const submitBtn = document.getElementById('submitBtn');

  let isRecoverySessionValid = false;

  function showBanner(text, type) {
    banner.style.display = 'block';
    banner.className = 'banner ' + (type === 'error' ? 'banner-error' : type === 'success' ? 'banner-success' : 'banner-info');
    banner.textContent = text;
  }

  // Intercept the recovery event
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      isRecoverySessionValid = true;
      banner.style.display = 'none';
      form.style.display = 'block';
    } else if (event === 'SIGNED_OUT') {
      isRecoverySessionValid = false;
    }
  });

  // Fallback timeout: if no valid token event fired within 3.5 seconds
  setTimeout(async () => {
    if (!isRecoverySessionValid) {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        showBanner('Invalid or expired password reset link. Please request a new link from the operator login page.', 'error');
        form.style.display = 'none';
      }
    }
  }, 3500);

  function validateEntropy(password) {
    const minLength = password.length >= 8;
    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasDigit = /[0-9]/.test(password);
    const hasSpecial = /[^A-Za-z0-9]/.test(password);
    return minLength && hasUpper && hasLower && hasDigit && hasSpecial;
  }

  async function handlePasswordUpdate(event) {
    event.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      showBanner('Passwords do not match.', 'error');
      return;
    }

    if (!validateEntropy(newPassword)) {
      showBanner('Password does not meet required complexity standards.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
      const { error } = await sb.auth.updateUser({ password: newPassword });

      if (error) {
        showBanner(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Credentials';
        return;
      }

      // Successful update: immediately terminate recovery session
      await sb.auth.signOut();

      showBanner('Password updated successfully. Redirecting to sign in...', 'success');
      form.style.display = 'none';

      setTimeout(() => {
        window.location.replace('operator.html');
      }, 2000);

    } catch (err) {
      showBanner('Network or handshake failure. Please retry.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Credentials';
    }
  }
</script>
</body>
</html>
